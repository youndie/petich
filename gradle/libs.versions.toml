[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here.
sborka = "0.1.0.4"
kotlin = "2.4.10"
ktor = "3.5.2"
exposed = "1.4.0"
# Test-only, and only in :petich-chronik: the claim that a timer and a saga state commit together
# is about a real transaction, and nothing smaller can be asked about it.
postgres-driver = "42.7.13"
testcontainers = "2.0.5"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serverStatusPages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
ktor-serializationJson = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }

exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-json = { group = "org.jetbrains.exposed", name = "exposed-json", version.ref = "exposed" }

postgres-driver = { module = "org.postgresql:postgresql", version.ref = "postgres-driver" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
sborkaKmp = { id = "ru.workinprogress.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "ru.workinprogress.sborka.lint", version.ref = "sborka" }
sborkaJvm = { id = "ru.workinprogress.sborka.jvm", version.ref = "sborka" }
sborkaPublish = { id = "ru.workinprogress.sborka.publish", version.ref = "sborka" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
