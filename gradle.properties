kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# The head of the version; CI appends the run number through -PVERSION. Plain `version`, which is
# what Gradle reads on its own and what sborka's `determine-version` action expects by default —
# `petich.version` was one more name for the same thing.
version=0.1.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
# `io.github.<login>.<library>` and not the bare `io.github.youndie`: one namespace per library, the
# way bochka, booblik, viddik and now chronik sit on Central. The bare one resolves too -- a verified
# namespace covers what is under it -- but it puts every library of the portfolio in one directory.
sborka.group=io.github.youndie.petich
sborka.repository=youndie/petich
sborka.description=A distributed saga engine for Kotlin: interceptor pipeline, compensation, suspend/resume, transactional outbox.
sborka.inceptionYear=2026

# THE SAME NUMBER TWICE, AND ON PURPOSE. The floor is the oldest Java a consumer may be on — a
# decision, not a side effect of whatever JDK the build ran on; 25 was the JDK this build happened to
# run on, and it cost every consumer on 21 the ability to use the library at all (#11). Nothing in
# petich needs a Java newer than 21 — there is no java.* call in any source set — so compiling on a
# newer toolchain would buy nothing and risk exactly that again.
sborka.jvmToolchain=21
sborka.jvmFloor=21

# OFF, AND IT SHOULD NOT STAY OFF. `explicitApi()` is right for a published library and sborka turns
# it on by default; here it costs 117 errors across 13 files in the two modules that got as far as
# compiling, and more behind them. Spelling out a visibility and a return type on every public
# declaration is a change to the LIBRARY, not to how it is built — folded into the migration it would
# bury whatever the migration itself breaks in a diff nobody can read.
# Tracked separately: youndie/petich#15.

# MAVEN CENTRAL. Applies the plugin that adds the javadoc jar and the detached signature per file
# that the portal requires and Reposilite never asked for; the signature follows the key rather than
# a second switch, so a snapshot still publishes without one.
#
# Uploading is not done from here: `central.yaml` in youndie/sborka takes the repository, the tree
# and the version, and the four portal secrets live there rather than once per library.
sborka.central=true
