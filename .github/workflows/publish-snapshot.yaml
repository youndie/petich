# The steps this file used to spell out live in sborka now — `.github/workflows/publish-wip.yaml`,
# called below — including the proba job, which asks the repository what a consumer would actually
# resolve after the upload rather than trusting the build directory before it.
name: Publish petich snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  publish:
    uses: youndie/sborka/.github/workflows/publish-wip.yaml@main
    with:
      tasks: build publishAllPublicationsToWipRepository
      # Without the version: it does not exist until the job below has run, so it is appended on
      # the other side. Every published module belongs here — a module added without a line here is
      # a module nobody ever resolves, which is what `consumer-coverage-audit.py` fails the build
      # over on a pull request.
      coordinates: |
        io.github.youndie.petich:petich-core
        io.github.youndie.petich:petich-idempotency
        io.github.youndie.petich:petich-ktor
        io.github.youndie.petich:petich-outbox-core
        io.github.youndie.petich:petich-postgres
        io.github.youndie.petich:petich-scheduler
        io.github.youndie.petich:petich-chronik
    # Named one by one rather than `secrets: inherit`: this hands them to a workflow in another
    # repository, and the two it needs are the two it gets.
    secrets:
      REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
      REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
