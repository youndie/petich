# The documentation gate. The code gate is build.yaml, and the two are separate on purpose: this one
# needs python and seconds, that one needs a JDK, a local publication and three audits.
#
# The checks are docs-bootstrap's, at the ref in the `uses: youndie/docs-bootstrap@...` lines below
# (templates/workflow-check.yaml). The version is written here and nowhere else: CI runs the checks
# at that ref, and the Makefile reads the same line and fetches the same ref for a local
# `make check`. Renovate bumps it; both lines name the same ref, and the Makefile refuses to guess
# when they do not.
name: check

# No path filters. They save seconds and buy red default branches: a generated index diverges from
# its sources when something outside the listed paths moves, and a new directory is a list nobody
# remembers to update. The whole tree is checked in seconds.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `make check` - the gate, petich's own audits under it, and the reports - and around it the two
      # checks that depend on the event: on a pull request, backlog item numbers against the base
      # branch, BEFORE the gate, because that one says which branch took a number and under what
      # name; on a push to the default branch, `status: draft` as an error. The reasons are written
      # next to each step in the action's action.yml.
      - uses: youndie/docs-bootstrap@v0.3.5

  # On a schedule rather than on a pull request, and non-blocking: the report cannot tell a live path
  # from one quoted as obsolete, so a person reads it, and a red build nobody caused is a build
  # people learn to ignore.
  #
  # The sibling repositories are not cloned here, and need not be: the research's paths into
  # chronik, kore, sborka, konekt and shashki are addresses at the commit each fact was read in
  # (docs/README.md), listed in their own section and never as rot. This job answers for the paths
  # into THIS repository.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/docs-bootstrap@v0.3.5
        with:
          target: report
