name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon

      # The audit reads real published metadata, which is why it publishes locally first. It exists
      # because the defect it looks for is invisible to the build itself: everything compiles, tests
      # and publishes green, and only a consumer finds out. An artifact whose file name is built from
      # a different version than its coordinate arrives under a name no release ever had, and two
      # releases then put identically-named files on a classpath.
      # Both audits exist because the defect they look for is invisible to the build itself:
      # everything compiles, tests and publishes green, and only a consumer finds out. Names, because
      # an artifact built from a different version than its coordinate arrives under a name no
      # release ever had. The floor, because bytecode newer than a consumer's JVM resolves and
      # compiles before failing in their runtime — and every machine this is built on is too new to
      # see it.
      #
      # What neither covers is a public signature handing out a third-party type from an
      # `implementation` dependency: telling that from a correct `implementation` needs a build that
      # compiles against the publication. That was proba's job in publish-snapshot.yaml, and since
      # the JVM floor is advertised as 25 proba's consumer build — pinned to Java 21 — can no longer
      # resolve petich, so the check reports UNDETERMINED for every coordinate and nothing covers
      # that case here at all. See #11; the job stays green either way, which is the point of it.
      - name: Published artifacts are named right and stay within the JVM floor
        run: |
          ./gradlew publishToMavenLocal -PVERSION=ci-${{ github.run_number }} --no-daemon
          python3 tools/artifact-name-audit.py ci-${{ github.run_number }}
          python3 tools/jvm-floor-audit.py ci-${{ github.run_number }}
